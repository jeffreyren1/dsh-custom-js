name: Bug report
description: Report a reproducible problem in dsh-custom-js
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets or private data. For vulnerabilities, use the private process in SECURITY.md.
  - type: input
    id: plugin-version
    attributes:
      label: dsh-custom-js version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      placeholder: 0.1.7-rc.2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, and browser/webview if relevant.
      placeholder: Windows 11, Node.js 22.20.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Install ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Paste relevant sanitized logs or screenshots.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
